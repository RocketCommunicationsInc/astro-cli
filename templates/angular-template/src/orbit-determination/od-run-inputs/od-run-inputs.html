<div class="od-run_input-wrapper">
  <h2>Inputs</h2>
  <div class="od-run_inputs">
    <rux-input label="Name" type="text"></rux-input>
    <rux-select
      label="Space Vehicle"
      input-id="1"
      label-id="1"
      name="default"
      size="medium"
    >
      <rux-option value="" selected="" label="Select an option"></rux-option>
      <rux-option value="1.1" label="Option 1.1"></rux-option>
      <rux-option value="1.2" label="Option 1.2"></rux-option>
      <rux-option value="1.3" label="Option 1.3"></rux-option>
      <rux-option
        value="1.4"
        disabled=""
        label="Option 1.4 (disabled)"
      ></rux-option>
    </rux-select>

    <rux-select
      label="Propagator"
      input-id="1"
      label-id="1"
      name="default"
      size="medium"
    >
      <rux-option value="" selected="" label="Select an option"></rux-option>
      <rux-option value="1.1" label="Option 1.1"></rux-option>
      <rux-option value="1.2" label="Option 1.2"></rux-option>
      <rux-option value="1.3" label="Option 1.3"></rux-option>
      <rux-option
        value="1.4"
        disabled=""
        label="Option 1.4 (disabled)"
      ></rux-option>
    </rux-select>

    <rux-select
      label="Estimator"
      input-id="1"
      label-id="1"
      name="default"
      size="medium"
    >
      <rux-option value="" selected="" label="Select an option"></rux-option>
      <rux-option value="1.1" label="Option 1.1"></rux-option>
      <rux-option value="1.2" label="Option 1.2"></rux-option>
      <rux-option value="1.3" label="Option 1.3"></rux-option>
      <rux-option
        value="1.4"
        disabled=""
        label="Option 1.4 (disabled)"
      ></rux-option>
    </rux-select>

    <rux-checkbox name="schedule" label="Schedule">Schedule</rux-checkbox>

    <rux-button class="od-run_inputs-set-schedule" disabled secondary icon="open-in-new">Set Schedule</rux-button>
    <rux-button class="od-run_inputs-add-state" secondary icon="playlist-add">Add State</rux-button>

    <p>Measurement Range</p>
    <rux-input label="To" type="date"></rux-input>
    <rux-input label="From" type="date"></rux-input>
  </div>
</div>
